<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — SmarterDiff</title>
<meta name="description" content="Get in touch with the SmarterDiff team." />
<link rel="stylesheet" href="styles.css" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
  .contact-form { display: grid; gap: 12px; max-width: 540px; }
  .contact-form input, .contact-form textarea {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 14px; font-family: inherit;
  }
  .contact-form textarea { min-height: 140px; resize: vertical; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="/" style="color:inherit;text-decoration:none;"><span>SmarterDiff</span></a></div>
  <nav class="nav"><a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a></nav>
</header>
<main class="container">
  <h1>Contact</h1>
  <p>Questions, bug reports, feature requests, or partnership ideas — all welcome.</p>

  <!-- Replace the form action with your own Formspree (or equivalent) endpoint -->
  <form id="contact-form" class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label>
      Your email
      <input type="email" name="email" required />
    </label>
    <label>
      Subject
      <input type="text" name="subject" required />
    </label>
    <label>
      Message
      <textarea name="message" required></textarea>
    </label>
    <button class="btn primary" type="submit" style="justify-self:start;">Send message</button>
  </form>

  <div id="contact-status" aria-live="polite" style="margin-top:12px;font-size:14px;color:var(--muted);"></div>

  
</main>
<footer class="footer">
  <nav class="footer-nav">
    <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="/contact.html">Contact</a>
  </nav>
  <small>© 2026 SmarterDiff</small>
</footer>
<script>
  (function(){
    var form = document.getElementById('contact-form');
    if (!form) return;
    var status = document.getElementById('contact-status');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      status.style.color = '';
      status.textContent = 'Sending…';

      var action = form.getAttribute('action');
      if (!action || action.indexOf('YOUR_FORM_ID') !== -1) {
        status.style.color = 'crimson';
        status.textContent = 'Please set your Formspree form ID in the form action.';
        return;
      }

      var data = new FormData(form);

      fetch(action, {
        method: 'POST',
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      }).then(function(response){
        if (response.ok) return response.json().catch(function(){return {ok:true}});
        return response.json().then(function(err){throw err}).catch(function(){throw new Error('Request failed')});
      }).then(function(){
        form.reset();
        status.style.color = 'green';
        status.textContent = 'Message sent — thanks!';
      }).catch(function(err){
        status.style.color = 'crimson';
        status.textContent = 'Sorry — sending failed. Please email hello@smarterdiff.com';
        console.error('Contact form error:', err);
      });
    });
  })();
</script>
</body>
</html>
